name: CI

on:
  push:
    branches-ignore:
      - 'gh-readonly-queue/**' # don't run (again) when on these special branches created during merge groups; the `on: merge_group` already triggers it.
  merge_group:

env:
  PYTHONUNBUFFERED: True
  PRE_COMMIT_HOME: ${{ github.workspace }}/.precommit_cache

jobs:
  pre-commit:
    permissions:
      contents: write # needed for mutex
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-24.04"
        python-version:
            - 3.12.7
    name: Pre-commit for Py${{ matrix.python-version }} on ${{ matrix.os }}
    timeout-minutes: 8
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Tooling
        run: python .devcontainer/install-ci-tooling.py

      - name: Install Dependencies
        run: |
          uv sync --frozen
          uv pip list

      - name: Compute Pre-commit cache key # must run after checkout, since hashFiles needs the file on disk
        run: |
          echo "CACHE_RESTORE_KEY=${{ matrix.os }}-${{ matrix.python-version }}-build-cache-pre-commit-hooks-" >> "$GITHUB_ENV"
          echo "CACHE_KEY=${{ matrix.os }}-${{ matrix.python-version }}-build-cache-pre-commit-hooks-${{ hashFiles('.pre-commit-config.yaml') }}" >> "$GITHUB_ENV"

      - name: Restore Pre-commit hooks cache # no mutex needed; concurrent cache reads are safe, only writes cause trouble
        id: cache-probe
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: ${{ env.CACHE_KEY }}
          restore-keys: ${{ env.CACHE_RESTORE_KEY }}

      - name: Set up mutex # Github concurrency management is horrible, things get arbitrarily cancelled if queued up. So using mutex until github fixes itself. When multiple jobs are modifying cache at once, weird things can happen.  possible issue is https://github.com/actions/toolkit/issues/658
        if: ${{ runner.os != 'Windows' && steps.cache-probe.outputs.cache-hit != 'true' }} # we're just gonna have to YOLO on Windows, because this action doesn't support it yet https://github.com/ben-z/gh-action-mutex/issues/14. Only serialize when this job will have to write a new cache entry.
        uses: ben-z/gh-action-mutex@1ebad517141198e08d47cf72f3c0975316620a65 # v1.0.0-alpha.10
        with:
          branch: mutex-venv-${{ matrix.os }}-${{ matrix.python-version }}
        timeout-minutes: 30 # this is the amount of time this action will wait to attempt to acquire the mutex lock before failing, e.g. if other jobs are queued up in front of it

      - name: Re-restore Pre-commit hooks cache # another job may have created the exact-key cache while we waited on the mutex
        id: cache-recheck
        if: ${{ steps.cache-probe.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: ${{ env.CACHE_KEY }}
          restore-keys: ${{ env.CACHE_RESTORE_KEY }}

      - name: Run pre-commit
        run: |
          pre-commit run -a || PRE_COMMIT_EXIT_CODE=$?
          if [ -n "$PRE_COMMIT_EXIT_CODE" ]; then
            echo "Pre-commit failed with exit code $PRE_COMMIT_EXIT_CODE"
            echo "Showing git diff:"
            git --no-pager diff
            exit $PRE_COMMIT_EXIT_CODE
          fi

      - name: Save Pre-commit hooks cache
        if: ${{ steps.cache-probe.outputs.cache-hit != 'true' && steps.cache-recheck.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: ${{ env.CACHE_KEY }}

  unit-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-24.04"
        python-version:
            - 3.12.7
    name: Unit Test for Py${{ matrix.python-version }} on ${{ matrix.os }}
    needs:
      - pre-commit
    timeout-minutes: 8
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.11.1

      - name: Install Tooling
        run: python .devcontainer/install-ci-tooling.py

      - name: Install Dependencies
        run: |
          uv sync --frozen
          uv pip list

      - name: Run Unit Tests
        # TODO: figure out what to do about tests of copier task scripts that don't actually get detected by code coverage
        run: uv run pytest tests/unit --durations=5 --no-cov

  lint-matrix:
    needs: [ pre-commit ]
    strategy:
      matrix:
        os:
          - "ubuntu-24.04"
        python-version:
            - 3.12.7
            - 3.13.1
        copier: [
          '--data-file tests/copier_data/data1.yaml',
          '--data-file tests/copier_data/data2.yaml',
          ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    permissions:
      contents: write # needed for mutex

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.11.1

      - name: Install Tooling
        run: python .devcontainer/install-ci-tooling.py

      - name: Instantiate copier template
        run: |
          copier copy --trust --vcs-ref ${{ github.sha }} ${{ matrix.copier }} --data python_version=${{ matrix.python-version }} . ./new-template

      - name: Confirm instantiated template has copier answers file
        run: |
          if [ ! -f "./new-template/.config/.copier-answers.yml" ]; then
            echo "Copier answers file not found in instantiated template location"
            exit 1
          fi

      - name: Delete files from initial repo
        run: |
          # Delete everything except the folder containing the instantiated template
          # https://stackoverflow.com/questions/34057047/delete-all-directories-except-one
          shopt -s extglob
          rm -rf !(new-template)
          rm -rf .github # apparently this folder doesn't get removed with the previous command for some reason
          rm -rf .devcontainer # apparently this folder doesn't get removed with the previous command for some reason
          rm -rf .claude # apparently this folder doesn't get removed with the previous command for some reason
          rm -rf .config # apparently this folder doesn't get removed with the previous command for some reason
          ls -la
      - name: Move the instantiated template into the repo root
        run: |
          # Move all the files from the instantiated template out of the subfolder
          shopt -s dotglob # https://unix.stackexchange.com/questions/6393/how-do-you-move-all-files-including-hidden-from-one-directory-to-another
          mv new-template/* .
          ls -la
          # delete the subfolder
          rm -frd new-template
          ls -la


      - name: install new dependencies
        run: |
          uv sync
          uv pip list
          # Add everything to git so that pre-commit recognizes the files and runs on them
          git add .
          git status

      - name: Compute Pre-commit cache key # must run after the instantiated template is in place, since hashFiles reads its .pre-commit-config.yaml
        run: |
          echo "CACHE_RESTORE_KEY=${{ matrix.os }}-${{ matrix.python-version }}-build-cache-pre-commit-hooks-" >> "$GITHUB_ENV"
          echo "CACHE_KEY=${{ matrix.os }}-${{ matrix.python-version }}-build-cache-pre-commit-hooks-${{ hashFiles('.pre-commit-config.yaml') }}" >> "$GITHUB_ENV"

      - name: Restore Pre-commit hooks cache # no mutex needed; concurrent cache reads are safe, only writes cause trouble
        id: cache-probe
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: ${{ env.CACHE_KEY }}
          restore-keys: ${{ env.CACHE_RESTORE_KEY }}

      - name: Set up mutex # Github concurrency management is horrible, things get arbitrarily cancelled if queued up. So using mutex until github fixes itself. When multiple jobs are modifying cache at once, weird things can happen.  possible issue is https://github.com/actions/toolkit/issues/658
        if: ${{ runner.os != 'Windows' && steps.cache-probe.outputs.cache-hit != 'true' }} # we're just gonna have to YOLO on Windows, because this action doesn't support it yet https://github.com/ben-z/gh-action-mutex/issues/14. Only serialize when this job will have to write a new cache entry.
        uses: ben-z/gh-action-mutex@1ebad517141198e08d47cf72f3c0975316620a65 # v1.0.0-alpha.10
        with:
          branch: mutex-venv-${{ matrix.os }}-${{ matrix.python-version }}
        timeout-minutes: 30 # this is the amount of time this action will wait to attempt to acquire the mutex lock before failing, e.g. if other jobs are queued up in front of it

      - name: Re-restore Pre-commit hooks cache # another job may have created the exact-key cache while we waited on the mutex
        id: cache-recheck
        if: ${{ steps.cache-probe.outputs.cache-hit != 'true' }}
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: ${{ env.CACHE_KEY }}
          restore-keys: ${{ env.CACHE_RESTORE_KEY }}

      - name: Run pre-commit
        run: |
          # skip devcontainer context hash because the template instantiation may make it different every time
          SKIP=git-dirty,compute-devcontainer-context-hash pre-commit run -a

      - name: Save Pre-commit hooks cache
        if: ${{ steps.cache-probe.outputs.cache-hit != 'true' && steps.cache-recheck.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: ${{ env.CACHE_KEY }}

      - name: Upload pre-commit log if failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4.4.3
        with:
          name: pre-commit-log--${{ github.jobs.lint-matrix.name }}
          path: "${{ github.workspace }}/.precommit_cache/pre-commit.log"

  required-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    needs:
      - pre-commit
      - lint-matrix
      - unit-test
    if: always()
    permissions: {}
    steps:
      - name: fail if prior job failure
        run: |
          success_pattern="^(skipped|success)$" # these are the possibilities: https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#needs-context

          if [[ ! "${{ needs.pre-commit.result }}" =~ $success_pattern ]] ||
            [[ ! "${{ needs.lint-matrix.result }}" =~ $success_pattern ]] ||
            [[ ! "${{ needs.unit-test.result }}" =~ $success_pattern ]]; then
            echo "❌ One or more jobs did not finish with skipped or success"
            exit 1
          fi
          echo "✅ All jobs finished with skipped or success"
