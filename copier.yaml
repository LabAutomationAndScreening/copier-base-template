# questions
repo_name:
    type: str
    help: What is the name of the repository?

repo_org_name:
    type: str
    help: What's the organization or username that owns this repository (look in the URL)?

repo_org_name_for_copyright:
    type: str
    help: What's the human-readable organization or username that should be set for the copyright?
    default: "{{ repo_org_name }}"

description:
    type: str
    help: What is this copier template used for?

install_claude_cli:
    type: bool
    help: Should the Claude CLI be installed in the devcontainer?
    default: no

python_version:
    type: str
    help: What version of Python?
    default: "3.13.9"

python_ci_versions:
    type: str
    help: What versions should Python run CI on the instantiated template?
    multiselect: true
    choices:
      - "3.12.7"
      - "3.13.9"
      - "3.14.0"

ssh_port_number:
    type: int
    help: What port should the devcontainer bind SSH to?
    # 10000-29999 sits below every OS's ephemeral range (Linux 32768+, Windows/macOS 49152+). Windows Hyper-V/winnat reserves port blocks only inside its ephemeral range, re-picked each boot, so a fixed carve-out of the reserved blocks doesn't work
    # Gaps skip common local dev services: 11211 memcached, 15672 RabbitMQ management UI, 27017-27019 MongoDB
    default: "{{ ((range(10000, 11211) | list) + (range(11212, 15672) | list) + (range(15673, 27017) | list) + (range(27020, 30000) | list)) | random }}"
template_uses_python:
    type: bool
    help: Is this a template that will use Python within it?
    default: yes

template_uses_pulumi:
    type: bool
    help: Is this a template that will use Python Pulumi within it?
    default: no

template_uses_typescript:
    type: bool
    help: Is this a template that will use Typescript within it?
    default: no

template_uses_vuejs:
    type: bool
    help: Is this a template that will use VueJS within it?
    default: no
    when: "{{ template_uses_typescript }}"

template_might_want_to_install_aws_ssm_port_forwarding_plugin:
    type: bool
    help: Is this template for something that might want the AWS SSM Port Forwarding plugin be installed?
    default: no

template_might_want_to_use_helm:
    type: bool
    help: Is this template for something that might deploy a Helm chart from deployment/helm/?
    default: no

template_might_want_to_use_vcrpy:
    type: bool
    help: Is this template for something that might want to use VCRpy during unit testing?
    default: no
    when: "{{ template_uses_python }}"

template_might_want_to_use_python_asyncio:
    type: bool
    help: Is this template for something that might want to use Python asyncio?
    default: no
    when: "{{ template_uses_python }}"

template_publishes_releases:
    type: bool
    help: Does this template publish versioned releases (e.g. to PyPI, npm, or a container registry)?
    default: no

copier_answers_directory:
    type: str
    help: What directory within the instantiated template contains the .copier-answers.yml file? Use '.' for the root, or a subdirectory path (e.g. 'frontend').
    default: ".config"

_tasks:
  - command: |
        python3 '{{ _copier_conf.src_path }}/src/copier_base_template/copier_tasks/remove_precommit_hooks.py' \
            --hook-id-regex '^\s*-\s+id:\s+merge-claude-settings\s*$' \
            --target-file .pre-commit-config.yaml
    when: "{{ not install_claude_cli }}"
  # Copier does not preserve executable permissions when instantiating the template, so we set them explicitly here.
  # git update-index is also needed because with core.fileMode=false (common on WSL2) git ignores the on-disk exec bit,
  # so a plain `git add` would not capture it. It is guarded on the file being tracked, since on an initial `copier copy`
  # into a fresh repo the file is not in the index yet (the chmod alone covers that case).
  - command: |
        if [ -f scripts/delete_false_positive_rej.py ]; then
            chmod +x scripts/delete_false_positive_rej.py
            if git ls-files --error-unmatch scripts/delete_false_positive_rej.py > /dev/null 2>&1; then
                git update-index --chmod=+x scripts/delete_false_positive_rej.py
            fi
        fi
  - command: |
        for script in .claude/helpers/*.py .claude/skills/*/*.py; do
            if [ -f "$script" ] && head -n 1 "$script" | grep -q '^#!'; then
                chmod +x "$script"
                if git ls-files --error-unmatch "$script" > /dev/null 2>&1; then
                    git update-index --chmod=+x "$script"
                fi
            fi
        done
  - command: |
        if [ -f .config/ruff.toml ]; then
            echo "Updating ruff target-version from python_version..."
            py_major_minor="$(printf '%s' '{{ python_version }}' | cut -d. -f1,2)"
            py_tag="py$(printf '%s' "$py_major_minor" | tr -d '.')"
            sed -i -E 's/^target-version = "py[0-9]+"/target-version = "'"$py_tag"'"/' .config/ruff.toml
        else
            echo ".config/ruff.toml not found; skipping Ruff target-version update."
        fi
  - command: |
        python3 '{{ _copier_conf.src_path }}/src/copier_base_template/copier_tasks/copier_provenance.py' \
            '{{ _copier_conf.src_path }}/template' \
            '.' \
            --template-src '{{ _src_path }}'

_min_copier_version: "9.8"

_answers_file: ".config/.copier-answers.yml"

_subdirectory: template

_templates_suffix: .jinja-base

_exclude:
    - "copier.yaml"

# adapted from https://github.com/copier-org/copier-template-extensions#context-hook-extension
_jinja_extensions:
- copier_template_extensions.TemplateExtensionLoader
- extensions/context.py:ContextUpdater
